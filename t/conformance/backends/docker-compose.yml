# Services for the result backend conformance suite. Start what you need:
#   docker compose -f t/conformance/backends/docker-compose.yml up -d redis toxiproxy
# then run, for example:
#   pytest t/conformance/backends --backend redis
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    network_mode: host
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
  postgresql:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: pw, POSTGRES_DB: celery}
    ports: ["5432:5432"]
  mysql:
    image: mysql:8
    environment: {MYSQL_ROOT_PASSWORD: pw, MYSQL_DATABASE: celery}
    ports: ["3306:3306"]
  memcached:
    image: memcached:1.6
    ports: ["11211:11211"]
  couchdb:
    image: couchdb:3
    environment: {COUCHDB_USER: admin, COUCHDB_PASSWORD: pw}
    ports: ["5984:5984"]
  consul:
    image: hashicorp/consul:1.19
    command: agent -dev -client=0.0.0.0
    ports: ["8500:8500"]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]
  dynamodb:
    image: amazon/dynamodb-local
    ports: ["8000:8000"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
  cassandra:
    # Create the keyspace once it is up:
    #   docker compose exec cassandra cqlsh -e "CREATE KEYSPACE IF NOT EXISTS celery
    #     WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
    image: cassandra:4.1
    environment: {MAX_HEAP_SIZE: 1G, HEAP_NEWSIZE: 200M}
    ports: ["9042:9042"]
  arangodb:
    # Create the collection once it is up:
    #   curl -u root:pw -X POST localhost:8529/_db/_system/_api/collection -d '{"name":"conformance"}'
    image: arangodb:3.11
    environment: {ARANGO_ROOT_PASSWORD: pw}
    ports: ["8529:8529"]
